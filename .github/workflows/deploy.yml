name: Deploy Attendance (attendance.admission.tn)

# Déploiement manuel de l'app candidat de présence QR.
#   - Domaine : attendance.admission.tn (site IIS, reverse proxy vers le port 3070, cf. web.config)
#   - Dossier : C:\apps\attendance.admission.tn
#   - Process : pm2 "attendance" (next start --port 3070)
# Les fichiers créés à la main sur le serveur (.env, web.config) sont conservés.
# La branche est choisie avec « Use workflow from » dans l'onglet Actions.

on:
  workflow_dispatch:

concurrency:
  group: deploy-attendance
  cancel-in-progress: false

env:
  DEPLOY_DIR: 'C:\apps\attendance.admission.tn'
  APP_NAME: 'attendance'
  PM2: 'C:\nvm4w\nodejs\pm2.cmd'

jobs:
  deploy:
    name: Deploy selected branch
    runs-on: [self-hosted, windows]

    steps:
      - name: Safety guard - target must be the attendance folder
        shell: powershell
        run: |
          $target = "${{ env.DEPLOY_DIR }}".TrimEnd('\').ToLowerInvariant()
          if ($target -ne 'c:\apps\attendance.admission.tn') {
            Write-Error "Refusing to run: unexpected deploy target '$target'."
            exit 1
          }

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync source (keep .env, web.config, node_modules)
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "${{ env.DEPLOY_DIR }}")) {
            New-Item -ItemType Directory -Path "${{ env.DEPLOY_DIR }}" -Force | Out-Null
          }
          $src = "$env:GITHUB_WORKSPACE\"
          $dst = "${{ env.DEPLOY_DIR }}\"
          $rc = @(
            $src, $dst, '/MIR',
            '/XF', '.env', 'web.config',
            '/XD', "$dst.git", "$dst.next", "$dst`node_modules",
            '/NFL', '/NDL', '/NP', '/R:2', '/W:5'
          )
          & robocopy @rc
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy failed ($LASTEXITCODE)"; exit 1 }
          foreach ($f in '.env', 'web.config') {
            $p = Join-Path "${{ env.DEPLOY_DIR }}" $f
            if (-not (Test-Path -LiteralPath $p) -or (Get-Item $p).Length -eq 0) {
              Write-Error "$f missing or empty in ${{ env.DEPLOY_DIR }} - create it on the server first (see README)."
              exit 1
            }
          }
          exit 0

      - name: Install dependencies
        shell: powershell
        working-directory: ${{ env.DEPLOY_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Stop app before build (releases locks on .next)
        shell: powershell
        run: |
          & "${{ env.PM2 }}" describe "${{ env.APP_NAME }}" *> $null
          if ($LASTEXITCODE -eq 0) { & "${{ env.PM2 }}" stop "${{ env.APP_NAME }}" }
          exit 0

      - name: Build
        shell: powershell
        working-directory: ${{ env.DEPLOY_DIR }}
        timeout-minutes: 15
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Start / restart with pm2
        shell: powershell
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          $pm2 = "${{ env.PM2 }}"
          & $pm2 describe "${{ env.APP_NAME }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            & $pm2 restart "${{ env.APP_NAME }}" --update-env
          } else {
            & $pm2 start npm --name "${{ env.APP_NAME }}" -- start
          }
          & $pm2 save
